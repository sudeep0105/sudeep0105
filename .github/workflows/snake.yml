name: Generate Snake Animation

on:
  schedule:
    # Runs every 12 hours automatically
    - cron: "0 */12 * * *"
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  
  # Triggers automatically when pushing to main
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution grid snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6C5CE7&color_dots=#EBEDF0,#FFEAA7,#FAB1A0,#E17055,#D63031
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00F0FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push generated SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
